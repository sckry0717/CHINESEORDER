<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYBIL Fast Food Restaurant</title>
    <style>
        :root {
            --primary-color: #e67e22;
            --secondary-color: #2c3e50;
            --bg-color: #f8f9fa;
            --success-color: #2ecc71;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        header {
            text-align: center;
            padding: 25px 0;
            background-color: var(--secondary-color);
            color: white;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: 1px;
        }

        header p {
            margin: 10px 0 0 0;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* 商品列表區 */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .menu-item {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .menu-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .menu-item img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .item-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-name {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .item-price {
            color: var(--primary-color);
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .qty-input {
            width: 55px;
            padding: 6px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        .btn-add {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            flex-grow: 1;
            transition: background 0.2s;
        }

        .btn-add:hover {
            background-color: #d35400;
        }

        /* 購物車區 */
        .cart-panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .cart-title {
            font-size: 1.4rem;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-top: 0;
            color: var(--secondary-color);
        }

        .cart-items {
            max-height: 350px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .btn-remove {
            background: none;
            border: none;
            color: #ff4d4d;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 5px;
        }

        .btn-remove:hover {
            text-decoration: underline;
        }

        .total-section {
            font-size: 1.4rem;
            font-weight: bold;
            text-align: right;
            margin-bottom: 20px;
            border-top: 2px solid #eee;
            padding-top: 15px;
        }

        .btn-pay {
            width: 100%;
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-pay:hover {
            background-color: #27ae60;
        }

        .btn-pay:active {
            transform: scale(0.98);
        }

        /* 模擬刷卡彈出視窗 (Modal Overlay) */
        .payment-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .payment-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .payment-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 85%;
        }

        .payment-box h2 {
            margin-top: 0;
            color: var(--secondary-color);
            font-size: 1.6rem;
        }

        .pay-amount {
            font-size: 2.2rem;
            color: var(--primary-color);
            font-weight: bold;
            margin: 15px 0;
        }

        /* 讀取中旋轉圈圈 */
        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #f3f3f3;
            border-top: 6px solid var(--primary-color);
            border-radius: 50%;
            margin: 30px auto;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 支付成功打勾圖示 */
        .success-icon {
            width: 70px;
            height: 70px;
            background-color: var(--success-color);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            font-weight: bold;
            margin: 25px auto;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3);
        }
    </style>
</head>
<body>

<header>
    <h1>SYBIL Fast Food Restaurant</h1>
    <p>Please select your meal</p>
</header>

<div class="container">
    <div class="menu-grid" id="menu"></div>

    <div class="cart-panel">
        <h3 class="cart-title">您的訂單</h3>
        <div class="cart-items" id="cart-items">
            <p style="color: #888; text-align: center; padding: 20px 0;">購物車還是空的</p>
        </div>
        <div class="total-section">
            總計: $<span id="total-price">0</span>
        </div>
        <button class="btn-pay" onclick="openPaymentModal()">確認支付</button>
    </div>
</div>

<div class="payment-overlay" id="paymentModal">
    <div class="payment-box">
        <h2>刷卡支付</h2>
        <div class="pay-amount">$<span id="modal-amount">0</span></div>
        
        <div id="loading-view">
            <div class="spinner"></div>
            <p style="font-size: 1.2rem; font-weight: bold; color: #444; margin-bottom: 5px;">請感應卡片...</p>
            <p style="color: #999; font-size: 0.85rem; margin: 0;">( 正在模擬讀卡，倒數 3 秒... )</p>
        </div>

        <div id="success-view" style="display: none;">
            <div class="success-icon">✓</div>
            <p style="font-size: 1.4rem; font-weight: bold; color: var(--success-color); margin-bottom: 8px;">支付成功！</p>
            <p style="color: #666; margin: 0;">感謝您的點購，餐點已進入廚房製作。</p>
        </div>
    </div>
</div>

<script>
    // 預設完整的餐點資料（使用穩定、清晰的寫實食物圖源）
    const products = [
        { id: 1, name: '果汁', price: 30, img: 'https://images.unsplash.com/photo-1621506289937-a8e4df240d0b?auto=format&fit=crop&w=400&q=80' },
        { id: 2, name: '牛奶', price: 40, img: 'https://images.unsplash.com/photo-1550583724-b2692b85b150?auto=format&fit=crop&w=400&q=80' },
        { id: 3, name: '漢堡', price: 60, img: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=400&q=80' },
        { id: 4, name: '水', price: 10, img: 'https://images.unsplash.com/photo-1548839140-29a749e1cf4d?auto=format&fit=crop&w=400&q=80' },
        { id: 5, name: '熱狗堡', price: 50, img: 'https://images.unsplash.com/photo-1619740455993-9e612b1af08a?auto=format&fit=crop&w=400&q=80' },
        { id: 6, name: '冰淇淋', price: 45, img: 'https://images.unsplash.com/photo-1501443762994-82bd5dace89a?auto=format&fit=crop&w=400&q=80' }
    ];

    let cart = [];

    // 建立菜單 HTML 節點
    function renderMenu() {
        const menuEl = document.getElementById('menu');
        menuEl.innerHTML = products.map(p => `
            <div class="menu-item">
                <img src="${p.img}" alt="${p.name}">
                <div class="item-info">
                    <div>
                        <div class="item-name">${p.name}</div>
                        <div class="item-price">$${p.price}</div>
                    </div>
                    <div class="controls">
                        <input type="number" id="qty-${p.id}" class="qty-input" value="1" min="1" max="20">
                        <button class="btn-add" onclick="addToCart(${p.id})">加入點餐</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // 新增餐點至購物車
    function addToCart(id) {
        const product = products.find(p => p.id === id);
        const qtyInput = document.getElementById(`qty-${id}`);
        const quantity = parseInt(qtyInput.value);

        if (quantity <= 0 || isNaN(quantity)) return;

        const existingItem = cart.find(item => item.id === id);
        if (existingItem) {
            existingItem.quantity += quantity;
        } else {
            cart.push({ ...product, quantity });
        }

        qtyInput.value = 1; // 加完後重置輸入框為 1
        renderCart();
    }

    // 自購物車中移除品項
    function removeFromCart(id) {
        cart = cart.filter(item => item.id !== id);
        renderCart();
    }

    // 重新繪製購物車介面
    function renderCart() {
        const cartItemsEl = document.getElementById('cart-items');
        const totalPriceEl = document.getElementById('total-price');
        
        if (cart.length === 0) {
            cartItemsEl.innerHTML = '<p style="color: #888; text-align: center; padding: 20px 0;">購物車還是空的</p>';
            totalPriceEl.innerText = '0';
            return;
        }

        let total = 0;
        cartItemsEl.innerHTML = cart.map(item => {
            const itemTotal = item.price * item.quantity;
            total += itemTotal;
            return `
                <div class="cart-item">
                    <div>
                        <strong>${item.name}</strong> x ${item.quantity}
                        <br><span style="color:#888; font-size:0.85rem;">單價: $${item.price}</span>
                    </div>
                    <div style="text-align: right;">
                        <div>$${itemTotal}</div>
                        <button class="btn-remove" onclick="removeFromCart(${item.id})">移除</button>
                    </div>
                </div>
            `;
        }).join('');

        totalPriceEl.innerText = total;
    }

    // 開啟感應支付彈窗 (核心倒數與跳轉邏輯)
    function openPaymentModal() {
        if (cart.length === 0) {
            alert('您的購物車是空的，請先選擇餐點唷！');
            return;
        }

        const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        document.getElementById('modal-amount').innerText = total;

        // 初始化顯示：轉圈圈狀態
        document.getElementById('loading-view').style.display = 'block';
        document.getElementById('success-view').style.display = 'none';
        document.getElementById('paymentModal').classList.add('active');

        // 步驟一：感應滿 3 秒後自動跳轉成功畫面
        setTimeout(() => {
            document.getElementById('loading-view').style.display = 'none';
            document.getElementById('success-view').style.display = 'block';

            // 步驟二：成功畫面顯示 1.5 秒後自動關閉彈窗並清空購物車
            setTimeout(() => {
                document.getElementById('paymentModal').classList.remove('active');
                cart = [];
                renderCart();
            }, 1500);

        }, 3000); // 3000 毫秒 = 3 秒
    }

    // 初始化網頁資料
    renderMenu();
</script>

</body>
</html>
